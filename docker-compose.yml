version: "3.9"

services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: event-weaver-svc
    ports:
      - "8080:8080"
    environment:
      APP_ENV: "docker"
      GITHUB_ACTION_SECRET: "${GITHUB_ACTION_SECRET}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "test1234"
    restart: unless-stopped